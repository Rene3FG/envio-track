name: Web

on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace @enviotrack/web
      - run: npm run test:e2e --workspace @enviotrack/web
