openapi: 3.0.3
info:
  title: EnvíoTrack API
  version: 0.1.0
  description: Contrato inicial. Actualízalo en el mismo PR que cambie la API.
servers:
  - url: http://localhost:8080/api
tags:
  - name: auth
  - name: packages
  - name: sync
  - name: public
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión (JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token de acceso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { description: Credenciales inválidas }
  /packages:
    get:
      tags: [packages]
      summary: Listar paquetes
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/PackageStatus' } }
        - { name: repartidor_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Lista de paquetes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Package' }
    post:
      tags: [packages]
      summary: Crear paquete
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageCreate' }
      responses:
        '201':
          description: Paquete creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
  /packages/{id}/assign:
    patch:
      tags: [packages]
      summary: Asignar paquete a un repartidor
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repartidor_id]
              properties:
                repartidor_id: { type: integer }
      responses:
        '200':
          description: Paquete asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { description: No encontrado }
  /packages/{id}/events:
    post:
      tags: [packages]
      summary: Registrar evento de entrega (entregado o fallido)
      description: Idempotente por client_event_id; reenviar el mismo UUID no duplica el evento.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Evento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '200':
          description: Evento ya existía (mismo client_event_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { description: No encontrado }
  /sync:
    post:
      tags: [sync]
      summary: Sincronizar un lote de eventos capturados offline
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventos]
              properties:
                eventos:
                  type: array
                  items: { $ref: '#/components/schemas/SyncEvent' }
      responses:
        '200':
          description: Resultado por evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados:
                    type: array
                    items:
                      type: object
                      properties:
                        client_event_id: { type: string, format: uuid }
                        status: { type: string, enum: [creado, duplicado, error] }
                        detalle: { type: string }
  /track/{guia}:
    get:
      tags: [public]
      summary: Rastreo público por número de guía
      parameters:
        - { name: guia, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Estado e historial del paquete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracking' }
        '404': { description: Guía no encontrada }
  /stats:
    get:
      tags: [packages]
      summary: Indicadores de entregas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  entregados: { type: integer }
                  fallidos: { type: integer }
                  pendientes: { type: integer }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        rol: { type: string, enum: [admin, repartidor] }
    PackageStatus:
      type: string
      enum: [pendiente, asignado, en_ruta, entregado, fallido]
    PackageCreate:
      type: object
      required: [destinatario, direccion]
      properties:
        destinatario: { type: string }
        direccion: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    Package:
      allOf:
        - $ref: '#/components/schemas/PackageCreate'
        - type: object
          properties:
            id: { type: integer }
            guia: { type: string }
            estado: { $ref: '#/components/schemas/PackageStatus' }
            repartidor_id: { type: integer, nullable: true }
    EventCreate:
      type: object
      required: [client_event_id, tipo, lat, lng]
      properties:
        client_event_id: { type: string, format: uuid }
        tipo: { type: string, enum: [entregado, fallido] }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        foto_url: { type: string, format: uri, nullable: true }
        nota: { type: string, nullable: true }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventCreate'
        - type: object
          properties:
            id: { type: integer }
            package_id: { type: integer }
            created_at: { type: string, format: date-time }
    SyncEvent:
      allOf:
        - $ref: '#/components/schemas/EventCreate'
        - type: object
          required: [package_id]
          properties:
            package_id: { type: integer }
            capturado_en: { type: string, format: date-time }
    Tracking:
      type: object
      properties:
        guia: { type: string }
        estado: { $ref: '#/components/schemas/PackageStatus' }
        historial:
          type: array
          items: { $ref: '#/components/schemas/Event' }
